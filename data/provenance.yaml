# Where this data comes from. Everything needed to rebuild it.
source:
  name: OpenStreetMap planet
  file: planet-260831.osm.pbf
  snapshot: 2026-08-31
  url: https://planet.openstreetmap.org/pbf/planet-260831.osm.pbf
  size: 94612383571
  md5: c67437924cf55de40e8708c7192f354d
  md5_verified: 2026-09-25
  retention_note: |
    OSM keeps its dated planet files for about ten years, so this URL is
    expected to outlive most copies of this dataset. It is the one link that
    makes the whole chain checkable: fetch it, verify the md5, and every step
    below can be run again.
  license: ODbL
  license_note: |
    OSM distributes planet files under ODbL, and this extract inherits it:
    attribute the source, and share alike if you redistribute a modified
    version.

extent:
  name: 日本 / Japan
  rule: |
    The administrative relation at admin_level=2 carrying ISO3166-1=JP, and
    nothing else.
  count: 47 prefectures
  boundary_file: japan_osm_boundary.geojson
  boundary_note: |
    Derived from the same snapshot as the data. Taking it from anywhere else
    invites a vintage mismatch: in the Tokyo cut of this same planet file, a
    boundary drawn a year earlier dropped way/1553541361, created 2026-08-30,
    which broke Setagaya's ring and with it every area query for that ward.
    Nothing in the totals showed it.
  boundary_note_2: |
    Natural Earth is not consulted. Its 10m coastline runs inland of the
    reclaimed land around Tokyo Bay and drops about a quarter of the special
    wards' area; the same class of error on a country outline removes ports
    and reclaimed land everywhere.

extraction:
  tool: osmium-tool 1.16.0 (libosmium 2.20.0)
  strategy: complete_ways
  steps:
    - bbox: 122.0,20.0,154.5,46.2
      note: |
        Deliberately generous. It reaches into Korea, Sakhalin, the Kurils and
        Taiwan, because the real border is cut afterwards with an outline
        derived from this same file.
      output: japan-bbox-260831.osm.pbf, 3,383,314,581 bytes
    - polygon: japan_osm_boundary.geojson
      output: japan-260831.osm.pbf, 2,807,823,198 bytes
  note: |
    A way with at least one node inside Japan is kept whole, including the
    nodes that fall outside. Nothing is cut at the boundary, so the bounding
    box of the result reaches past the outline: the Ogasawara ferry route is
    one way running a thousand kilometres out to sea.

parquet:
  built_from: japan-260831.osm.pbf
  chain:
    - tool: osm2pgsql
      version: 1.11.0
      output: pgsql (classic)
      style: default.style, md5 ca34bbc54e6113a4b01e588e8f085f15
      flags: [--hstore, --cache 8000, --flat-nodes]
      projection: EPSG:3857 (osm2pgsql's default; no -l, -E or -G)
      runtime: 701s
      note: |
        The style decides which tags become columns, so it is pinned by
        checksum rather than by the package version. --hstore is not optional
        here: opening_hours, start_date, building:levels and operator:en are
        not promoted to columns by this style.

        --cache and --flat-nodes are the two differences from the Tokyo
        recipe and neither touches the schema. 318 million node locations do
        not belong in RAM on a machine without swap.
    - tool: postgis/postgis docker image
      version: 16-3.4
    - tool: duckdb
      version: 1.5.5
      script: scripts/07_export_parquet.py
      output: tmp/parquet-export/ (not published)
      note: |
        Reads the PostGIS tables and writes the Parquet, in the order PostGIS
        returns rows and with no GeoParquet metadata. The 1.5 line is
        required; earlier lines misbehave here.
    - tool: duckdb (Python) with the spatial extension
      version: 1.5.6
      script: scripts/08_relayout_parquet.py
      output: parquet/ (published)
      done: 2026-10-06
      note: |
        Rewrites the export of 07 for spatial reading. No value changes; 09
        checks that.
      order: |
        ST_Hilbert of the bbox centre of each geometry, over the whole
        EPSG:3857 square (+-20037508.342789244 m, 16 bits an axis), then
        osm_id, then the WKB bytes. No DOUBLE column is a sort key: DuckDB
        1.5.6 returns -0.0 as 0.0 from a DOUBLE used directly in ORDER BY.
      row_groups: |
        Sized to about 32 MiB uncompressed from each table's own bytes per
        row: point 276,480 rows (14 groups), line 135,168 (91), polygon
        163,840 (204), roads 57,344 (14). Groups of 128 MiB were tried first
        and pruned badly (11 of 51 polygon groups for a 1 km box).
      covering: |
        bbox struct<xmin, ymin, xmax, ymax> of doubles, equal to
        ST_Extent(way) on every row, appended after the osm2pgsql columns.
      geo_metadata: |
        GeoParquet 1.1.0. primary_column way, encoding WKB, geometry_types
        [Point] / [LineString] / [Polygon] / [LineString], the extent, the
        bbox covering, and crs as the PROJJSON of EPSG:3857 from the PROJ
        database (PROJ 9.1.1) inside DuckDB spatial.
      crs_evidence: |
        05_load_postgis.sh passes no -l, -E or -G, so osm2pgsql 1.11 uses its
        default EPSG:3857, which is what PostGIS records as
        geometry(*, 3857). ST_AsBinary drops the SRID, so it was checked from
        the numbers: node 2149761647 (東京, railway=station) is
        (15558758.54, 4256850.67) in the export, and the inverse of EPSG:3857
        gives 139.766706, 35.6812546, its OSM position.
      verification: |
        scripts/09_verify_parquet.py on all four tables against the export:
        same 70 columns in order, same row count and same hash digests over
        every column (way as bytes, FLOAT as text), same -0.0 and NaN counts,
        Hilbert order, bbox = ST_Extent(way), and the geo metadata equal to
        the one recomputed from the data. All passed on 2026-10-06. An exact
        EXCEPT ALL of all columns in both directions also returned 0 rows for
        each table.
  conversions:
    - column: way
      from: geometry(*, 3857)
      to: WKB bytes, still EPSG:3857, declared in the GeoParquet metadata
    - column: tags
      from: hstore
      to: JSON text
  added:
    - column: bbox
      what: struct<xmin, ymin, xmax, ymax> of doubles, ST_Extent(way) in EPSG:3857
      why: |
        Its row group statistics let a reader skip groups for a bbox query.
        WKB bytes have no usable statistics.
  unchanged: |
    The other 68 columns keep the names and types osm2pgsql gave them, in
    the same order. No column was renamed or dropped and the projection was
    not changed, so a query written against planet_osm_point in PostGIS reads
    almost the same against the Parquet. The only column added is bbox, last.

rows:
  planet_osm_point: 3720141
  planet_osm_line: 12259617
  planet_osm_polygon: 33281956
  planet_osm_roads: 762255

objects:
  nodes: 318225406
  ways: 45679976
  relations: 241943
  first_timestamp: 2007-07-03T14:12:14Z
  last_timestamp: 2026-08-30T23:59:34Z

verification:
  extract_md5: |
    japan-260831.osm.pbf is 2f803a54de5bdeb5ecbbb740c9b5100d, and re-cutting
    it from japan-bbox-260831.osm.pbf with the same outline reproduces those
    bytes exactly.
  planet_md5: |
    The 94 GB planet file on disk was checksummed in full on 2026-09-25 and
    matches the md5 recorded above.
  prefecture_rings: 1918/1918 boundary ways present, no prefecture incomplete
  place_nodes: 47/47 prefectures have a place node in the extract

not_included:
  - what: the sea around Japan beyond the OSM outline
    reason: |
      Japan's admin_level=2 relation follows the coast and the maritime
      borders, so the cut is a superset of the land but not of the whole EEZ.
  - what: a -G / --multi-geometry load
    reason: |
      Left at osm2pgsql's default, so a multipolygon relation occupies several
      rows sharing one negated osm_id. Aggregate before measuring an area or
      a distance to a boundary.
  - what: an Overpass database
    reason: |
      The script is in the repository and works, but a country-sized Overpass
      import is long enough that it is not part of the published artifact.
      The pbf is what it would be built from.
